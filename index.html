<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="決算ノート">
<meta name="theme-color" content="#f7f2e8">
<title>決算ノート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  // テーマ（自動/ライト/ダーク）は描画前に当てて、ちらつきを防ぐ
  try { const t = localStorage.getItem('kessan-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ───── デザイン：紙の本（エディトリアル）。フォントはメイリオ ───── */
:root{
  --bg:#f7f2e8; --surface:#fbf8f1; --surface-2:#efe8d8; --ink:#262019; --ink2:#3d362c; --muted:#6b6155;
  --line:#cfc6b6; --line-strong:#262019; --divider:#ddd3c2;
  --primary:#262019; --primary-hover:#3d362c; --primary-active:#000; --on-primary:#f7f2e8;
  --accent:#b3341f; --tint:#efe6d2; --tint-2:#e6dabf; --link:#b3341f;
  --ok:#2e6b4f; --ok-bg:#e4efe8; --ng:#b3341f; --ng-bg:#f7e6e1; --warn:#9a6b00; --warn-bg:#f6edd2; --warn-ink:#5e4400;
  --focus:#ffd43d;
  --k-rev:#2f4b7c; --k-rev-bg:#e8edf5;
  --k-cost:#b3341f; --k-cost-bg:#f7e6e1;
  --k-profit:#2e6b4f; --k-profit-bg:#e4efe8;
  --k-gray:#6b6155; --k-gray-bg:#ece5d6;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.33,1,.68,1);
  --font:Meiryo,"メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1b1814; --surface:#221e19; --surface-2:#2b2620; --ink:#eee6d8; --ink2:#d8cfbf; --muted:#a89d8b;
  --line:#3b352c; --line-strong:#eee6d8; --divider:#322d25;
  --primary:#eee6d8; --primary-hover:#fff; --primary-active:#fff; --on-primary:#1b1814;
  --accent:#ee8a72; --tint:#2c261e; --tint-2:#3a3226; --link:#ee8a72;
  --ok:#7fd0a3; --ok-bg:#16291f; --ng:#ee8a72; --ng-bg:#3a1f19; --warn:#e8c34a; --warn-bg:#2b2717; --warn-ink:#f0dc9a;
  --k-rev:#9db7e8; --k-rev-bg:#1d2638;
  --k-cost:#ee8a72; --k-cost-bg:#3a1f19;
  --k-profit:#7fd0a3; --k-profit-bg:#16291f;
  --k-gray:#a89d8b; --k-gray-bg:#2b2620;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1814; --surface:#221e19; --surface-2:#2b2620; --ink:#eee6d8; --ink2:#d8cfbf; --muted:#a89d8b;
    --line:#3b352c; --line-strong:#eee6d8; --divider:#322d25;
    --primary:#eee6d8; --primary-hover:#fff; --primary-active:#fff; --on-primary:#1b1814;
    --accent:#ee8a72; --tint:#2c261e; --tint-2:#3a3226; --link:#ee8a72;
    --ok:#7fd0a3; --ok-bg:#16291f; --ng:#ee8a72; --ng-bg:#3a1f19; --warn:#e8c34a; --warn-bg:#2b2717; --warn-ink:#f0dc9a;
    --k-rev:#9db7e8; --k-rev-bg:#1d2638;
    --k-cost:#ee8a72; --k-cost-bg:#3a1f19;
    --k-profit:#7fd0a3; --k-profit-bg:#16291f;
    --k-gray:#a89d8b; --k-gray-bg:#2b2620;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);
  font-family:var(--font);font-weight:400;font-size:16px;line-height:1.8}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
main{max-width:640px;margin:0 auto;padding:calc(var(--safe-t) + 12px) 22px calc(var(--safe-b) + 64px);overflow-x:clip}
h1{font-size:30px;font-weight:700;margin:0;line-height:1.4}
h2{font-size:14px;font-weight:700;letter-spacing:.14em;margin:38px 0 14px;padding-top:12px;border-top:1px solid var(--line-strong);line-height:1.5}
h3{font-size:17px;font-weight:700;margin:0 0 8px;line-height:1.5}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:4px solid #000;outline-offset:2px;box-shadow:0 0 0 2px var(--focus)}
:root[data-theme="dark"] :focus-visible{outline-color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :focus-visible{outline-color:#fff}}

/* ボタン：インク色の長方形 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--primary);border-radius:2px;padding:12px 20px;min-height:52px;
  background:var(--primary);color:var(--on-primary);font-weight:700;font-size:16px;letter-spacing:.12em;line-height:1.4;
  transition:opacity .15s var(--ease),transform .12s var(--ease)}
.btn:hover{opacity:.88}
.btn:active{transform:translateY(1px)}
.btn.sub{background:transparent;color:var(--ink)}
.btn.sub:hover{background:var(--tint);opacity:1}
.btn.block{width:100%}
.btn:disabled{background:transparent;border-color:var(--line);color:var(--muted);pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1}
.link{border:0;background:none;color:var(--link);padding:6px 0;font-size:15px;text-align:left;text-decoration:underline;text-underline-offset:4px}

.card{background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.callout{border-left:4px solid var(--accent);background:var(--tint);padding:12px 16px;margin:18px 0}
.callout .k{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--accent)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.callout.warn .k{color:var(--warn-ink)}
.callout.memo{border-left-color:var(--line-strong);background:var(--surface-2)}
.callout.memo .k{color:var(--muted)}
.callout p{margin:4px 0 0;font-size:15px}

/* ───── ホーム ───── */
.hero{margin:6px 0 8px;padding-top:14px;border-top:3px solid var(--line-strong)}
.logo{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:700;line-height:1.25;letter-spacing:.04em}
.logo .mark{width:42px;height:42px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;color:var(--bg);flex:none}
.logo .mark svg{width:26px;height:26px}
.tagline{color:var(--muted);font-size:14px;margin:8px 0 0;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong)}
.stat{padding:12px 6px;text-align:center;border-left:1px solid var(--divider)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:32px;line-height:1.3;font-weight:700}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.1em}
.chapbar{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:15px}
.chapbar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapbar .pct{font-size:13px;color:var(--muted);width:44px;text-align:right}
.track{flex:0 0 80px;height:4px;background:var(--divider)}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .8s var(--ease)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line-strong);border-left:1px solid var(--line-strong)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:0;border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);border-radius:0;padding:16px;min-height:124px;text-align:left;
  background:transparent;color:var(--ink);transition:background .15s var(--ease)}
.mode:hover{background:var(--tint)}
.mode .ic{width:auto;height:auto;color:var(--accent);margin-bottom:auto;background:none}
.mode .ic .i{width:28px;height:28px}
.mode b{font-size:19px;letter-spacing:.1em}
.mode small{font-size:12px;color:var(--muted)}

/* ───── アコーディオン ───── */
.accs{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line-strong)}
.acc{border-bottom:1px solid var(--line-strong)}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 2px;min-height:60px}
.acc-h:hover{background:var(--tint)}
.pno{font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--accent);border:1px solid var(--accent);padding:0 7px;flex:none;white-space:nowrap;line-height:1.7}
.acc-h .ptl{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.55}
.acc-h .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.acc-h .pct{font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.acc-h .chev{color:var(--muted);transition:transform .3s var(--ease)}
.acc.open .acc-h .chev{transform:rotate(90deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-in{overflow:hidden;min-height:0;visibility:hidden}
.acc.open .acc-in{visibility:visible}
.acc-pad{padding:0 2px 14px}
.acc-row{display:flex;align-items:center}
.acc-row .acc-h{flex:1;min-width:0}
.selall{flex:none;border:1px solid var(--line-strong);background:transparent;border-radius:2px;padding:4px 12px;font-size:13px;font-weight:700;min-height:40px;margin-right:4px}
.selall.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.selall.some{border-color:var(--accent);color:var(--accent)}

/* ───── 学習 ───── */
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;margin:calc(-12px - var(--safe-t)) -22px 16px;
  padding:calc(var(--safe-t) + 10px) 22px 10px;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.stuck{border-bottom-color:var(--line-strong)}
.round{width:44px;height:44px;border-radius:0;border:1px solid var(--line-strong);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none}
.round:hover{background:var(--tint)}
.topbar .ttl{font-size:17px;font-weight:700;flex:1;min-width:0;line-height:1.45}
.chap{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.chap .n{font-size:16px;font-weight:700}
.list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 4px;min-height:56px}
.item:hover{background:var(--tint)}
.item .sid{font-size:12px;color:var(--muted);min-width:44px;letter-spacing:.06em}
.item .t{flex:1;font-weight:700;line-height:1.55;font-size:15px}
.item .star{font-size:12px;font-weight:700;color:var(--accent)}
.item .i{color:var(--muted)}
.crumb{font-size:12px;color:var(--accent);margin:0 0 6px;letter-spacing:.14em;font-weight:700}
.core{padding:6px 0 6px 18px;margin:20px 0 6px;border-left:4px solid var(--accent)}
.core .k{font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--accent)}
.core .v{font-size:19px;font-weight:700;line-height:1.75}
.points{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.points li{position:relative;padding:0 0 0 20px}
.points li::before{content:"";position:absolute;left:2px;top:.85em;width:8px;height:1.5px;background:var(--accent)}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:10px;margin:8px 0}
.check li::before{content:"";width:16px;height:16px;border:1.5px solid var(--ink);margin-top:6px;flex:none}
.term{padding:10px 0;border-top:1px solid var(--divider)}
.term:first-child{border-top:0;padding-top:0}
.term:last-child{padding-bottom:0}
.term .tt{font-weight:700}
.term .td{color:var(--ink2);font-size:15px}
.search{width:100%;border:0;border-bottom:2px solid var(--line-strong);border-radius:0;padding:10px 4px;min-height:52px;background:transparent;font-size:17px}

/* ───── 図解ブロック ───── */
.blk{margin:26px 0 0}
.blk-t{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.06em}
.blk-t::before{content:"";width:14px;height:3px;background:var(--accent)}
.blk-n{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.7}
.fchip{display:inline-block;padding:1px 8px;border:0;border-bottom:2px solid var(--k-gray);background:var(--k-gray-bg);font-weight:700;line-height:1.6;font-size:15px}
.fchip.k-rev,.kb.k-rev{border-color:var(--k-rev);background:var(--k-rev-bg)}
.fchip.k-cost,.kb.k-cost{border-color:var(--k-cost);background:var(--k-cost-bg)}
.fchip.k-profit,.kb.k-profit{border-color:var(--k-profit);background:var(--k-profit-bg)}
.fchip.k-gray,.kb.k-gray{border-color:var(--k-gray);background:var(--k-gray-bg)}
.formula{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 4px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.f-op{font-weight:700;font-size:20px;color:var(--accent)}
.f-label{font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:0}
.frac .n,.frac .d{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:4px 6px}
.frac .n{border-bottom:2px solid var(--ink)}
.f-times{font-weight:700}
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);-webkit-overflow-scrolling:touch}
.tbl-hint{font-size:12px;color:var(--muted);text-align:right;margin:4px 2px 0}
table.tbl{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--divider);text-align:left;vertical-align:top}
.tbl th{font-weight:700;font-size:12px;letter-spacing:.1em;white-space:nowrap;border-bottom:1px solid var(--line-strong);color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.hl td{background:var(--tint);font-weight:700}
.tbl td.pos{color:var(--ok);font-weight:700;text-align:center;font-size:18px}
.tbl td.neg{color:var(--ng);font-weight:700;text-align:center;font-size:18px}
.tbl td.zero{color:var(--muted);font-weight:700;text-align:center;font-size:16px}
.stack{display:flex;align-items:stretch;gap:10px}
.stack .scol{flex:1;min-width:0;display:flex;flex-direction:column}
.stack .sh{font-weight:700;text-align:center;padding:4px 0;font-size:13px;letter-spacing:.06em}
.stack .sbody{display:flex;flex-direction:column;height:300px;border:1.5px solid var(--ink);overflow:hidden}
.stack .sc{display:flex;flex-direction:column;justify-content:center;padding:4px 8px;border:0;border-bottom:1.5px solid var(--ink);min-height:0;overflow:hidden}
.stack .sc:last-child{border-bottom:0}
.stack .sc b{font-size:14px;line-height:1.4}
.stack .sc span{font-size:12px;color:var(--ink2)}
.stack .eq{align-self:center;font-weight:700;font-size:22px;color:var(--accent)}
/* 5つの利益などの縦の表：利益の行は太字＋二重線 */
.ladder{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line-strong)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--divider)}
.lrow .ll{font-size:14px;line-height:1.45;display:flex;gap:6px;align-items:baseline}
.lrow .ll i{font-style:normal;font-weight:700;width:1.1em;color:var(--accent);flex:none}
.lrow .lb{position:relative;height:22px}
.lrow .lb u{position:absolute;left:0;top:7px;height:6px;background:var(--k-gray);opacity:.45}
.lrow.k-rev .lb u{background:var(--k-rev)}
.lrow.k-cost .lb u{background:var(--k-cost)}
.lrow.k-profit .lb u{background:var(--k-profit);opacity:.9}
.lrow .lb span{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg);padding-left:6px}
.lrow.big{border-bottom:3px double var(--line-strong);padding:8px 0}
.lrow.big .ll{font-weight:700}
.lrow.big .lb span{font-size:16px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(72px,30%) 1fr;gap:10px;align-items:center}
.bar .bl{font-size:14px;line-height:1.4}
.bar .bb{position:relative;height:26px;background:var(--divider)}
.bar .bb u{position:absolute;left:0;top:0;bottom:0;background:var(--k-rev);opacity:.8;min-width:2px}
.bar.hl .bb u{background:var(--k-profit);opacity:.9}
.bar.neg .bb u{background:var(--k-cost)}
.bar .bb span{position:absolute;left:8px;top:0;bottom:0;display:flex;align-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);padding:0 6px;margin-left:-8px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.flow.v{flex-direction:column}
.fbox{flex:1 1 120px;min-width:0;border:0;border-top:3px solid var(--k-gray);background:var(--k-gray-bg);padding:8px 10px;text-align:center}
.fbox b{display:block;line-height:1.45}
.fbox small{display:block;font-size:12px;color:var(--ink2);line-height:1.5;margin-top:2px}
.fbox.k-rev{border-color:var(--k-rev);background:var(--k-rev-bg)}
.fbox.k-cost{border-color:var(--k-cost);background:var(--k-cost-bg)}
.fbox.k-profit{border-color:var(--k-profit);background:var(--k-profit-bg)}
.farrow{display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:20px;flex:none;min-width:20px}
.flow.v .farrow{transform:rotate(90deg);min-height:20px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cmpc{border:0;border-top:3px solid var(--k-gray);padding:8px 2px 0;background:transparent}
.cmpc.k-rev{border-color:var(--k-rev)}
.cmpc.k-cost{border-color:var(--k-cost)}
.cmpc.k-profit{border-color:var(--k-profit)}
.cmpc h4{margin:0 0 6px;font-size:16px}
.cmpc ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.65}
.cmpc li{margin:2px 0}
/* 触って確かめる計算機 */
.calc{border:1.5px solid var(--line-strong);padding:14px;background:var(--surface)}
.calc .cin{margin:6px 0}
.calc .cin label{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700}
.calc .cin output{font-variant-numeric:tabular-nums;color:var(--accent)}
.calc input[type=range]{width:100%;height:32px;margin:0;accent-color:var(--accent)}
.calc .couts{margin-top:12px;padding:8px;border:1.5px solid var(--line-strong);background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:6px}
.calc .couts.stick{position:sticky;bottom:calc(var(--safe-b) + 8px);z-index:5;box-shadow:0 -8px 12px -8px rgba(0,0,0,.3)}
.calc .cout{display:flex;flex-direction:column;justify-content:space-between;gap:0;padding:6px 8px;background:var(--tint);align-items:stretch}
.calc .cout.main{grid-column:1 / -1;flex-direction:row;align-items:baseline;justify-content:space-between;gap:10px;border-left:4px solid var(--accent);background:var(--tint-2)}
.calc .cout b{font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap}
.calc .cout.neg b{color:var(--ng)}
.calc .cout span{font-size:12px;font-weight:700;line-height:1.4}
.calc .cnote{font-size:13px;color:var(--muted);margin-top:8px}

/* ───── 演習 ───── */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:2px;padding:6px 14px;font-size:14px;font-weight:700;min-height:44px;
  display:inline-flex;align-items:center;gap:8px;text-align:left}
.chip:hover{background:var(--tint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.qbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;margin:calc(-12px - var(--safe-t)) -22px 16px;
  padding:calc(var(--safe-t) + 10px) 22px 10px;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.qbar.stuck{border-bottom-color:var(--line-strong)}
.prog{flex:1;height:4px;background:var(--divider)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}
.qcount{font-size:14px;color:var(--muted)}
.qcard{background:transparent;border:0;padding:0}
.q-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--accent)}
.orig{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line-strong);padding:0 6px;white-space:nowrap;letter-spacing:.1em}
.q-meta .sec{flex:1;min-width:0}
.q-prompt{font-size:18px;font-weight:700;line-height:1.75;margin:12px 0 6px}
.choices{margin-top:10px;border-top:1px solid var(--line)}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:12px 6px;margin:0;min-height:56px;line-height:1.6}
.choice:hover:not(:disabled){background:var(--tint)}
.choice:disabled{color:var(--ink);opacity:1;cursor:default}
.choice .key{width:22px;font-size:13px;font-weight:700;color:var(--muted);flex:none;text-align:center}
.choice.ok{background:var(--ok-bg);box-shadow:inset 4px 0 0 var(--ok)}
.choice.ok .key{color:var(--ok)}
.choice.ng{background:var(--ng-bg);box-shadow:inset 4px 0 0 var(--ng)}
.choice.ng .key{color:var(--ng)}
.choice.dim{opacity:.55}
.tf{display:flex;gap:0;margin-top:14px;border:1px solid var(--line-strong)}
.tf .choice{justify-content:center;min-height:80px;margin:0;border-bottom:0;flex:1}
.tf .choice+.choice{border-left:1px solid var(--line-strong)}
.tfm{width:32px;height:32px;stroke-width:2.5}
.verdict{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;margin:22px 0 4px}
.verdict.ok{color:var(--ok)}
.verdict.ng{color:var(--ng)}
.explain{margin:0 0 6px;font-size:15px}
.answer{background:var(--tint);border-left:4px solid var(--accent);padding:10px 14px;margin:14px 0 0}
.answer .k{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.answer .v{font-size:18px;font-weight:700}
.numin{display:flex;gap:8px;align-items:center;margin-top:12px}
.numin input{flex:1;min-width:0;border:0;border-bottom:2px solid var(--line-strong);border-radius:0;padding:8px 6px;font-size:22px;min-height:56px;background:transparent;text-align:right;font-variant-numeric:tabular-nums}
.numin .u{font-weight:700;font-size:16px;white-space:nowrap}
.ord-pool,.ord-ans{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ord-ans{min-height:60px;border:1px dashed var(--line-strong);padding:8px}
.ord-ans:empty::before{content:"ここに順番に並べる";color:var(--muted);font-size:13px}
.ord-ans .chip{background:var(--tint);border-color:var(--accent)}
.ord-ans .chip.ok{background:var(--ok-bg);border-color:var(--ok)}
.ord-ans .chip.ng{background:var(--ng-bg);border-color:var(--ng)}
.ord-ans .chip b{color:var(--accent);min-width:1.2em}
.ord-pool .chip.used{opacity:.3;pointer-events:none}

/* ───── 結果 ───── */
.result-hero{text-align:center;margin:12px 0;padding-top:14px;border-top:3px solid var(--line-strong)}
.score{font-size:68px;line-height:1.1;margin:6px 0 0;font-weight:700}
.score small{font-size:20px;color:var(--muted)}
.miss{padding:12px 0;border-top:1px solid var(--divider)}
.miss:first-child{border-top:0;padding-top:0}
.miss:last-child{padding-bottom:0}
.miss .q{font-weight:700;margin:2px 0}

/* ───── 設定 ───── */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 .chip{justify-content:center}
.filerow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--divider);font-size:14px}
.filerow:first-child{border-top:0;padding-top:0}
.filerow:last-child{padding-bottom:0}
.filerow b{font-weight:700;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 18px;font-size:15px;font-weight:700;z-index:20;max-width:90%;animation:fade-slide .3s var(--ease)}

/* ───── 動き（控えめ） ───── */
@keyframes route-fwd{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes route-back{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.enter-fwd{animation:route-fwd .32s var(--ease) both}
.enter-back{animation:route-back .32s var(--ease) both}
@keyframes fade-slide{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.enter-q{animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[data-anim] .stagger>*{animation:rise .45s var(--ease) both}
[data-anim] .stagger>*:nth-child(2){animation-delay:.05s}[data-anim] .stagger>*:nth-child(3){animation-delay:.1s}[data-anim] .stagger>*:nth-child(4){animation-delay:.15s}
[data-anim] .stagger>*:nth-child(n+5){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<main id="app"></main>

<input type="file" id="file-book" accept=".json,application/json" multiple class="hidden">
<input type="file" id="file-progress" accept=".json,application/json" class="hidden">

<script>
// ───── 保存（IndexedDB）─────
// 本のデータも学習記録も、この端末のブラウザの中だけに保存する
const DB_NAME = 'kessan-note';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbGet(key) {
  const db = await idb();
  return new Promise((res, rej) => {
    const r = db.transaction('kv').objectStore('kv').get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbSet(key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite');
    t.objectStore('kv').put(val, key);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}

// ───── 状態 ─────
const S = {
  book: null,        // { chapters:[], questions:[], parts:{}, files:[] }
  progress: {},      // 問題ID → { n, ok, last, lastOk }
  screen: 'home',    // home / learn / section / drill / quiz / result / terms / settings
  readSection: null,
  drill: { chapters: [], mode: 'all', count: 10 },
  quiz: null,
  termQuery: '',
  open: new Set(),
};
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const idCmp = (a, b) => a.localeCompare(b, 'ja', { numeric: true });
const yen = n => Number(n).toLocaleString('ja-JP');

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function allSections() { return S.book.chapters.flatMap(c => (c.sections || []).map(s => ({ ...s, chapter: c }))); }
function findSection(id) { return allSections().find(s => s.id === id); }
function chapterOfQuestion(q) { return q.section.split('-').slice(0, 2).join('-'); }
const hasBook = () => S.book && S.book.chapters.length;

// 本の「章」（大分類）。節の ID「1-2」の先頭が章番号
const partOf = chId => String(chId).split('-')[0];
function parts() {
  const map = new Map();
  for (const c of S.book.chapters) {
    const p = partOf(c.id);
    if (!map.has(p)) map.set(p, { id: p, title: S.book.parts?.[p] || `第${p}章`, chapters: [] });
    map.get(p).chapters.push(c);
  }
  return [...map.values()];
}
const partLabel = p => p.id === '0' ? '序章' : p.id === 'A' ? '巻末' : /^\d+$/.test(p.id) ? `第${p.id}章` : p.id;
const partRate = (qs, p) => {
  const ids = new Set(p.chapters.map(c => c.id)), pq = qs.filter(q => ids.has(chapterOfQuestion(q)));
  return pq.length ? pq.filter(q => S.progress[q.id]?.lastOk).length / pq.length : null;
};
const accKey = (scr, pid) => `${scr}:${pid}`;
const accHead = (scr, p, sub, right = '') => `
  <button class="acc-h" data-act="acc" data-id="${accKey(scr, p.id)}" aria-expanded="${S.open.has(accKey(scr, p.id))}">
    <span class="pno">${esc(partLabel(p))}</span>
    <span class="ptl">${esc(p.title)}${sub ? `<span class="sub">${sub}</span>` : ''}</span>${right}${icon('next', 'i chev')}
  </button>`;
const accWrap = (scr, p, head, body) =>
  `<div class="acc ${S.open.has(accKey(scr, p.id)) ? 'open' : ''}" data-key="${accKey(scr, p.id)}">${head}
    <div class="acc-b"><div class="acc-in"><div class="acc-pad">${body}</div></div></div></div>`;

// ───── 本のデータの読み込み ─────
// 何回かに分けて読み込んでも、章と問題はIDごとに追加・上書きされる
function mergeBook(base, add, fileName) {
  const book = base ? structuredClone(base) : { chapters: [], questions: [], files: [] };
  if (add.format !== 'kessan-note/1' || !Array.isArray(add.chapters)) throw new Error('決算ノート用のデータではありません');
  for (const ch of add.chapters) {
    const i = book.chapters.findIndex(c => c.id === ch.id);
    if (i >= 0) book.chapters[i] = ch; else book.chapters.push(ch);
  }
  for (const q of add.questions || []) {
    const i = book.questions.findIndex(x => x.id === q.id);
    if (i >= 0) book.questions[i] = q; else book.questions.push(q);
  }
  book.chapters.sort((a, b) => idCmp(a.id, b.id));
  book.parts = { ...(book.parts || {}), ...(add.parts || {}) };
  book.files = [...(book.files || []).filter(f => f.name !== fileName),
    { name: fileName, source: add.source || '', at: new Date().toISOString() }];
  return book;
}
document.getElementById('file-book').addEventListener('change', async e => {
  let book = S.book, n = 0;
  for (const f of e.target.files) {
    try { book = mergeBook(book, JSON.parse(await f.text()), f.name); n++; }
    catch (err) { toast(`${f.name}：${err.message}`); }
  }
  e.target.value = '';
  if (!n) return;
  S.book = book;
  await dbSet('book', book);
  toast(`${n}個のファイルを読み込みました`);
  render('none');
});

// ───── 学習記録のバックアップ ─────
function exportProgress() {
  const blob = new Blob([JSON.stringify({ format: 'kessan-note-progress/1', progress: S.progress }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `決算ノート_学習記録_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('file-progress').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.format !== 'kessan-note-progress/1') throw new Error('学習記録のファイルではありません');
    for (const [id, p] of Object.entries(d.progress)) {
      const cur = S.progress[id];
      if (!cur || (p.last || '') > (cur.last || '')) S.progress[id] = p;
    }
    await dbSet('progress', S.progress);
    toast('学習記録を読み込みました');
    render('none');
  } catch (err) { toast(err.message); }
});

// ───── テーマ ─────
function getTheme() { try { return localStorage.getItem('kessan-theme') || 'auto'; } catch (e) { return 'auto'; } }
function setTheme(t) {
  try { localStorage.setItem('kessan-theme', t); } catch (e) {}
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
}

// ───── 図解ブロックの描画 ─────
const OPS = new Set(['+', '−', '-', '×', '÷', '=', '(', ')', '／', '＋', '－']);
const kcls = k => k ? ` k-${esc(k)}` : '';
function termHtml(t) {
  if (typeof t === 'string') return OPS.has(t) ? `<span class="f-op" aria-hidden="false">${esc(t)}</span>` : `<span class="fchip">${esc(t)}</span>`;
  return `<span class="fchip${kcls(t.k)}">${esc(t.t)}</span>`;
}
const termsHtml = a => (a || []).map(termHtml).join('');
const blkTitle = b => b.title ? `<div class="blk-t">${esc(b.title)}</div>` : '';
const blkNote = b => b.note ? `<div class="blk-n">${esc(b.note)}</div>` : '';

// 計算機の入力設定は ID で引けるように保存しておく
const CALCS = new Map(); let calcSeq = 0;
function fmtVal(v, fmt, unit = '') {
  if (!isFinite(v)) return '—';
  if (fmt === 'p') return v.toFixed(1) + '%';
  if (fmt === 'x') return v.toFixed(2) + (unit || '');
  if (fmt === 'd') return Math.round(v).toLocaleString('ja-JP') + (unit || '');
  return Math.round(v).toLocaleString('ja-JP') + (unit || '');
}
function calcEval(cfg, vals) {
  const env = { ...vals }, out = {};
  for (const o of cfg.outs) {
    try { env[o.id] = new Function(...Object.keys(env), `return (${o.f});`)(...Object.values(env)); }
    catch (e) { env[o.id] = NaN; }
    out[o.id] = env[o.id];
  }
  return out;
}
function calcUpdate(root) {
  const cfg = CALCS.get(root.dataset.calc);
  const vals = {};
  root.querySelectorAll('input[type=range]').forEach(r => {
    vals[r.dataset.k] = Number(r.value);
    r.closest('.cin').querySelector('output').textContent = yen(r.value) + (r.dataset.unit || '');
  });
  const out = calcEval(cfg, vals);
  cfg.outs.forEach(o => {
    const el = root.querySelector(`[data-out="${o.id}"]`);
    el.querySelector('b').textContent = fmtVal(out[o.id], o.fmt, o.unit);
    el.classList.toggle('neg', out[o.id] < 0);
  });
}

function blockHtml(b) {
  switch (b.type) {
    case 'p': return `<div class="blk"><p>${esc(b.text)}</p></div>`;
    case 'callout': {
      const lbl = { point: 'ポイント', warn: '注意', memo: 'メモ' }[b.kind || 'point'];
      return `<div class="callout ${esc(b.kind || 'point')}"><div class="k">${esc(b.title || lbl)}</div><p>${esc(b.text)}</p></div>`;
    }
    case 'formula': {
      let inner = '';
      if (b.label) inner += `<span class="f-label">${esc(b.label)}</span><span class="f-op">＝</span>`;
      if (b.den) {
        inner += `<span class="frac"><span class="n">${termsHtml(b.num)}</span><span class="d">${termsHtml(b.den)}</span></span>`;
        if (b.times) inner += `<span class="f-times">${esc(b.times)}</span>`;
      } else inner += termsHtml(b.terms);
      return `<div class="blk">${blkTitle(b)}<div class="formula">${inner}</div>${blkNote(b)}</div>`;
    }
    case 'table': {
      const al = b.align || [];
      const head = b.head ? `<thead><tr>${b.head.map((h, i) => `<th class="${al[i] || ''}">${esc(h)}</th>`).join('')}</tr></thead>` : '';
      const rows = b.rows.map((r, ri) => `<tr class="${(b.hl || []).includes(ri) ? 'hl' : ''}">${r.map((c, i) => {
        const s = String(c);
        let cls = al[i] || '';
        if (s === '+' || s === '＋') cls = 'pos'; else if (s === '−' || s === '－' || s === '-') cls = 'neg'; else if (s === '±0') cls = 'zero';
        else if (!cls && /^[△▲-]?[\d,.]+(%|円|回転|日|か月)?$/.test(s)) cls = 'r';
        return `<td class="${cls}">${esc(s === '+' ? '＋' : s === '-' ? '−' : s)}</td>`;
      }).join('')}</tr>`).join('');
      return `<div class="blk">${blkTitle(b)}<div class="tbl-wrap"><table class="tbl">${head}<tbody>${rows}</tbody></table></div>${blkNote(b)}</div>`;
    }
    case 'stack': {
      const cols = b.cols.map(c => `<div class="scol"><div class="sh">${esc(c.title)}</div><div class="sbody">${c.items.map(it =>
        `<div class="sc kb${kcls(it.k)}" style="flex:${Math.max(it.v, 1)} 1 0"><b>${esc(it.label)}</b>${it.sub ? `<span>${esc(it.sub)}</span>` : ''}</div>`).join('')}</div></div>`);
      return `<div class="blk">${blkTitle(b)}<div class="stack">${cols.join(b.eq === false ? '' : '<div class="eq" aria-hidden="true">＝</div>')}</div>${blkNote(b)}</div>`;
    }
    case 'ladder': {
      const max = Math.max(...b.rows.map(r => Math.abs(r.v)), 1);
      return `<div class="blk">${blkTitle(b)}<div class="ladder">${b.rows.map(r => `
        <div class="lrow${kcls(r.k)}${r.big ? ' big' : ''}"><div class="ll"><i>${esc(r.sign || '')}</i>${esc(r.label)}</div>
        <div class="lb"><u style="width:${Math.max(Math.abs(r.v) / max * 100, 2)}%"></u><span>${r.v < 0 ? '△' : ''}${yen(Math.abs(r.v))}${esc(b.unit || '')}</span></div></div>`).join('')}</div>${blkNote(b)}</div>`;
    }
    case 'bars': {
      const max = b.max || Math.max(...b.items.map(r => Math.abs(r.v)), 1);
      return `<div class="blk">${blkTitle(b)}<div class="bars">${b.items.map(r => `
        <div class="bar${r.hl ? ' hl' : ''}${r.v < 0 ? ' neg' : ''}"><div class="bl">${esc(r.label)}</div>
        <div class="bb"><u style="width:${Math.max(Math.abs(r.v) / max * 100, 1)}%"></u><span>${r.v < 0 ? '△' : ''}${esc(String(r.text ?? yen(Math.abs(r.v))))}${esc(b.unit || '')}</span></div></div>`).join('')}</div>${blkNote(b)}</div>`;
    }
    case 'flow': {
      const parts2 = b.steps.map(s => `<div class="fbox${kcls(s.k)}"><b>${esc(s.t)}</b>${s.sub ? `<small>${esc(s.sub)}</small>` : ''}</div>`);
      const arrow = `<div class="farrow" aria-hidden="true">${esc(b.arrow || '→')}</div>`;
      return `<div class="blk">${blkTitle(b)}<div class="flow${b.v ? ' v' : ''}">${parts2.join(b.arrow === '' ? '' : arrow)}</div>${blkNote(b)}</div>`;
    }
    case 'compare':
      return `<div class="blk">${blkTitle(b)}<div class="cmp">${b.cols.map(c =>
        `<div class="cmpc${kcls(c.k)}"><h4>${esc(c.h)}</h4><ul>${c.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>${blkNote(b)}</div>`;
    case 'calc': {
      const id = 'c' + (++calcSeq); CALCS.set(id, b);
      const vals = Object.fromEntries(b.inputs.map(i => [i.k, i.v]));
      const out = calcEval(b, vals);
      return `<div class="blk">${blkTitle(b)}<div class="calc" data-calc="${id}">
        <div class="muted" style="margin:0 0 4px">スライダーを動かして、数字の変化を確かめてみよう</div>
        ${b.inputs.map(i => `<div class="cin"><label><span>${esc(i.label)}</span><output>${yen(i.v)}${esc(i.unit || '')}</output></label>
          <input type="range" data-k="${esc(i.k)}" data-unit="${esc(i.unit || '')}" min="${i.min}" max="${i.max}" step="${i.step || 1}" value="${i.v}" aria-label="${esc(i.label)}"></div>`).join('')}
        <div class="couts${b.inputs.length > 3 ? ' stick' : ''}">${b.outs.map(o => `<div class="cout${o.main ? ' main' : ''}${out[o.id] < 0 ? ' neg' : ''}" data-out="${esc(o.id)}"><span>${esc(o.label)}</span><b>${esc(fmtVal(out[o.id], o.fmt, o.unit))}</b></div>`).join('')}</div>
        ${b.note ? `<div class="cnote">${esc(b.note)}</div>` : ''}</div></div>`;
    }
  }
  return '';
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function startQuiz(questions) {
  // 選択肢・並べ替えの並びも毎回シャッフルする（答えの位置を覚えてしまわないように）
  const items = questions.map(q => {
    if (q.type === 'choice') return { q, order: shuffle(q.choices.map((_, i) => i)) };
    if (q.type === 'order') return { q, order: shuffle(q.items.map((_, i) => i)), chosen: [] };
    return { q };
  });
  S.quiz = { items, i: 0, answered: null, results: [] };
  go('quiz');
}

const TYPE_LABEL = { choice: '選択', tf: '○×', calc: '計算', order: '並べ替え' };
const origBadge = q => q.origin === 'original' ? '<span class="orig" title="参考書の内容をもとに作った、本にない問題">オリジナル</span>' : '';
const fmtAnswer = q => q.type === 'choice' ? q.choices[q.answer] : q.type === 'tf' ? (q.answer ? '○（正しい）' : '×（誤り）')
  : q.type === 'calc' ? `${q.answer.toLocaleString('ja-JP')}${q.unit || ''}` : q.items.join(' → ');
function parseNum(s) {
  const t = String(s).replace(/[０-９．，－−]/g, c => ({ '．': '.', '，': ',', '－': '-', '−': '-' }[c] || String.fromCharCode(c.charCodeAt(0) - 0xFEE0)))
    .replace(/[,\s%％円]/g, '').replace(/^[△▲]/, '-');
  return t === '' || isNaN(t) ? NaN : Number(t);
}
function renderQuestion(animate) {
  const z = S.quiz, it = z.items[z.i], q = it.q, a = z.answered;
  const sec = findSection(q.section);
  let body = (q.blocks || []).map(blockHtml).join('');
  if (q.type === 'choice') {
    body += `<div class="choices" role="group">` + it.order.map((ci, n) => {
      let cls = '';
      if (a) cls = ci === q.answer ? 'ok' : ci === a.pick ? 'ng' : 'dim';
      return `<button class="choice ${cls}" data-act="pick" data-id="${ci}" ${a ? 'disabled' : ''}><span class="key">${'ABCD'[n]}</span><span>${esc(q.choices[ci])}</span></button>`;
    }).join('') + `</div>`;
  } else if (q.type === 'tf') {
    body += `<div class="tf">${[[true, 'o', '正しい'], [false, 'x', '誤り']].map(([v, ic, lbl]) => {
      let cls = '';
      if (a) cls = v === q.answer ? 'ok' : v === a.pick ? 'ng' : 'dim';
      return `<button class="choice ${cls}" data-act="pick-tf" data-id="${v}" ${a ? 'disabled' : ''}>${icon(ic, 'i tfm')}<span>${lbl}</span></button>`;
    }).join('')}</div>`;
  } else if (q.type === 'calc') {
    body += `<div class="numin"><input id="num-in" inputmode="decimal" autocomplete="off" placeholder="数字を入力" ${a ? `value="${esc(a.pick)}" disabled` : ''} aria-label="答え">
      <span class="u">${esc(q.unit || '')}</span></div>`;
    if (q.hint && !a) body += `<p class="muted">ヒント：${esc(q.hint)}</p>`;
  } else if (q.type === 'order') {
    const items = q.items;
    body += `<div class="ord-ans" id="ord-ans">${it.chosen.map((ci, n) => {
      const cls = a ? (ci === n ? 'ok' : 'ng') : '';
      return `<button class="chip ${cls}" data-act="ord-del" data-id="${n}" ${a ? 'disabled' : ''}><b>${n + 1}</b>${esc(items[ci])}</button>`;
    }).join('')}</div>
    <div class="ord-pool">${it.order.map(ci => `<button class="chip ${it.chosen.includes(ci) ? 'used' : ''}" data-act="ord-add" data-id="${ci}" ${a ? 'disabled' : ''}>${esc(items[ci])}</button>`).join('')}</div>`;
  }
  const verdict = a?.ok ? '正解！' : '不正解';
  let after = '';
  if (a) after = `<div class="verdict ${a.ok ? 'ok' : 'ng'}" role="status">${icon(a.ok ? 'o' : 'x')}${verdict}</div>
      ${!a.ok ? `<div class="answer"><div class="k">正しい答え</div><div class="v">${esc(fmtAnswer(q))}</div></div>` : ''}
      <p class="explain" style="margin-top:12px">${esc(q.explain)}</p>
      ${sec ? `<button class="link" data-act="peek" data-id="${esc(sec.id)}">要点を読み返す：${esc(sec.title)}</button>` : ''}
      <button class="btn block" style="margin-top:18px" data-act="next">${z.i + 1 < z.items.length ? '次の問題へ' : '結果を見る'}${icon('next')}</button>`;
  else if (q.type === 'calc') after = `<button class="btn block" style="margin-top:16px" data-act="check-calc">答え合わせ</button>`;
  else if (q.type === 'order') after = `<button class="btn block" style="margin-top:16px" data-act="check-order" ${it.chosen.length === q.items.length ? '' : 'disabled'}>答え合わせ</button>`;
  app.innerHTML = `
    <div class="qbar">
      <button class="round" data-act="quit" aria-label="やめる">${icon('close')}</button>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${z.items.length}" aria-valuenow="${z.i + (a ? 1 : 0)}"><i style="width:${(z.i + (a ? 1 : 0)) / z.items.length * 100}%"></i></div>
      <span class="qcount num">${z.i + 1}/${z.items.length}</span>
    </div>
    <div class="qcard ${animate ? 'enter-q' : ''}" id="qcard">
      <div class="q-meta"><span class="tag">${TYPE_LABEL[q.type]}</span><span class="sec">${esc(sec ? sec.title : q.section)}</span>${origBadge(q)}</div>
      <div class="q-prompt">${esc(q.prompt)}</div>
      ${body}${after}
    </div>`;
}

async function answer(ok, pickVal) {
  const z = S.quiz, q = z.items[z.i].q;
  z.answered = { ok, pick: pickVal };
  z.results.push({ id: q.id, ok });
  const p = S.progress[q.id] || { n: 0, ok: 0 };
  p.n++; if (ok) p.ok++;
  p.last = new Date().toISOString(); p.lastOk = ok;
  S.progress[q.id] = p;
  dbSet('progress', S.progress);
  renderQuestion(false);
  document.querySelector('.verdict')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function renderResult() {
  const z = S.quiz, ok = z.results.filter(r => r.ok).length, total = z.results.length;
  const rate = ok / total;
  const wrong = z.results.filter(r => !r.ok).map(r => S.book.questions.find(q => q.id === r.id)).filter(Boolean);
  const line = rate === 1 ? 'パーフェクトです' : rate >= .7 ? 'よくできました' : rate >= .4 ? 'あと少し。間違えたところを見直そう' : '要点を読み返してから、もう一度挑戦しよう';
  app.innerHTML = `
    <div class="result-hero">
      <div class="muted" style="font-size:16px">${line}</div>
      <div class="score num"><span data-count="${ok}">0</span><small> / ${total}問</small></div>
      <div class="muted">正答率 ${Math.round(rate * 100)}%</div>
    </div>
    ${wrong.length ? `<h2>間違えた問題</h2><div class="card stagger">${wrong.map(q => `
      <div class="miss"><div class="q-meta"><span class="sec">${esc(findSection(q.section)?.title || q.section)}</span>${origBadge(q)}</div>
        <div class="q">${esc(q.prompt)}</div>
        <div class="muted">答え：${esc(fmtAnswer(q))}</div>
      </div>`).join('')}</div>
      <button class="btn block" style="margin-top:20px" data-act="retry">間違えた${wrong.length}問にもう一度挑戦</button>` : ''}
    <div class="row" style="margin-top:12px">
      <button class="btn sub" data-act="go" data-id="drill">演習メニュー</button>
      <button class="btn sub" data-act="go" data-id="home">ホーム</button>
    </div>`;
  const el = app.querySelector('[data-count]'), t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / 600); el.textContent = Math.round(ok * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ───── 設定 ─────
function renderSettings() {
  const t = getTheme();
  app.innerHTML = topbar('設定') + `
    <div class="stagger">
      <div><h2 style="margin-top:0">表示</h2>
      <div class="seg3">
        ${[['auto', '自動'], ['light', 'ライト'], ['dark', 'ダーク']].map(([k, l]) =>
          `<button class="chip ${t === k ? 'on' : ''}" data-act="theme" data-id="${k}">${l}</button>`).join('')}
      </div>
      <p class="muted" style="margin:8px 0 0">「自動」は端末の設定に合わせます。</p></div>
      <div><h2>参考書のデータ</h2>
      ${S.book?.files?.length ? `<div class="card">${S.book.files.map(f =>
        `<div class="filerow"><b>${esc(f.name)}</b><span class="muted num">${esc(f.at.slice(0, 10))}</span></div>`).join('')}</div>` :
        '<p class="muted">まだ読み込んでいません。</p>'}
      <p class="muted">新しい章のファイルを読み込むと、今のデータに追加されます。同じ章は上書きされます。</p>
      <button class="btn block" data-act="import">データを追加・更新する</button></div>
      <div><h2>学習記録のバックアップ</h2>
      <p class="muted" style="margin:0 0 10px">学習記録は端末ごとに保存されます。スマホとPCで記録をそろえたいときは、書き出したファイルをもう一方で読み込んでください。</p>
      <div class="row">
        <button class="btn sub" data-act="export">書き出す</button>
        <button class="btn sub" data-act="import-progress">読み込む</button>
      </div></div>
    </div>`;
}

// ───── 操作のまとめ受け ─────
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const id = t.dataset.id, d = S.drill;
  switch (t.dataset.act) {
    case 'go': if (id === 'drill' || id === 'home') S.quiz = null; return go(id);
    case 'import': return document.getElementById('file-book').click();
    case 'import-progress': return document.getElementById('file-progress').click();
    case 'export': return exportProgress();
    case 'theme': setTheme(id); return render('none');
    case 'open-sec': {
      S.readSection = id;
      if (S.screen === 'section') return render(t.dataset.dir === 'back' ? 'back' : 'fwd');
      return go('section');
    }
    case 'drill-sec': return startQuiz(shuffle(S.book.questions.filter(q => q.section === id)));
    case 'ch-all': d.chapters = []; return render('none');
    case 'acc': {
      const box = t.closest('.acc'), open = !box.classList.contains('open');
      box.classList.toggle('open', open);
      t.setAttribute('aria-expanded', open);
      if (open) S.open.add(id); else S.open.delete(id);
      return;
    }
    case 'part': {
      const ids = parts().find(p => p.id === id).chapters.map(c => c.id);
      const all = ids.every(x => d.chapters.includes(x));
      d.chapters = all ? d.chapters.filter(x => !ids.includes(x)) : [...new Set([...d.chapters, ...ids])];
      return render('none');
    }
    case 'ch': d.chapters = d.chapters.includes(id) ? d.chapters.filter(x => x !== id) : [...d.chapters, id]; return render('none');
    case 'mode': d.mode = id; return render('none');
    case 'count': d.count = Number(id); return render('none');
    case 'start': {
      const pool = shuffle(drillPool());
      return startQuiz(d.count ? pool.slice(0, d.count) : pool);
    }
    case 'pick': { const q = S.quiz.items[S.quiz.i].q; return answer(Number(id) === q.answer, Number(id)); }
    case 'pick-tf': { const q = S.quiz.items[S.quiz.i].q; const v = id === 'true'; return answer(v === q.answer, v); }
    case 'check-calc': {
      const q = S.quiz.items[S.quiz.i].q, raw = document.getElementById('num-in').value, v = parseNum(raw);
      if (isNaN(v)) return toast('数字で入力してください');
      const tol = q.tol ?? (Math.abs(q.answer) < 100 ? 0.05 : Math.abs(q.answer) * 0.005);
      return answer(Math.abs(v - q.answer) <= tol, raw);
    }
    case 'ord-add': { const it = S.quiz.items[S.quiz.i]; it.chosen.push(Number(id)); return renderQuestion(false); }
    case 'ord-del': { const it = S.quiz.items[S.quiz.i]; it.chosen.splice(Number(id), 1); return renderQuestion(false); }
    case 'check-order': {
      const it = S.quiz.items[S.quiz.i];
      return answer(it.chosen.every((c, n) => c === n), null);
    }
    case 'next':
      S.quiz.i++; S.quiz.answered = null;
      if (S.quiz.i >= S.quiz.items.length) return go('result');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return renderQuestion(true);
    case 'retry': {
      const ids = S.quiz.results.filter(r => !r.ok).map(r => r.id);
      return startQuiz(shuffle(S.book.questions.filter(q => ids.includes(q.id))));
    }
    case 'quit': S.quiz = null; return go('drill');
    case 'peek': S.readSection = id; S.peekFromQuiz = true; return go('section');
  }
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'num-in') document.querySelector('[data-act="check-calc"]')?.click();
});
// 要点をのぞいた後は、戻るボタンで問題に戻す
app.addEventListener('click', e => {
  const b = e.target.closest('.topbar .round[data-id="learn"]');
  if (b && S.peekFromQuiz && S.quiz) { e.stopImmediatePropagation(); S.peekFromQuiz = false; S.screen = 'quiz'; render('back'); }
}, true);

// 横にはみ出す表には、スクロールできることを知らせる
function hintTables() {
  app.querySelectorAll('.tbl-wrap').forEach(w => {
    if (w.scrollWidth > w.clientWidth + 2 && !w.nextElementSibling?.classList.contains('tbl-hint')) w.insertAdjacentHTML('afterend', '<div class="tbl-hint">← 横にスクロールできます →</div>');
  });
}
function onScroll() { app.querySelector('.topbar, .qbar')?.classList.toggle('stuck', window.scrollY > 4); }
window.addEventListener('scroll', onScroll, { passive: true });
const _render = render;
render = (...a) => { _render(...a); hintTables(); onScroll(); };

(async () => {
  S.book = await dbGet('book') || null;
  S.progress = await dbGet('progress') || {};
  render('fwd');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
